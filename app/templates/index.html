{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Get your AI workout plan</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/generate">
    <label>Name</label><input name="name" required>
    <div class="grid">
      <div><label>Age</label><input type="number" name="age" min="10" max="100" required></div>
      <div><label>Weight (kg)</label><input type="number" step="0.1" name="weight" min="20" max="300" required></div>
    </div>
    <label>Goal</label>
    <select name="goal">
      <option>Weight loss</option><option>Muscle gain</option>
      <option>Stay fit</option><option>Improve stamina</option>
    </select>
    <label>Intensity</label>
    <select name="intensity"><option>Low</option><option selected>Medium</option><option>High</option></select>
    <button type="submit">Generate Plan</button>
  </form>
</div>
{% endblock %}
